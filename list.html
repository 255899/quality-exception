<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>异常单管理 - 品质异常处理</title>
<link rel="stylesheet" href="css/app.css">
<style>
.page-header { display: flex; align-items: center; justify-content: space-between; padding: 0 16px; height: 48px; background: #1faa8a; color: #fff; position: sticky; top: 0; z-index: 10; }
.page-header .title { font-size: 16px; font-weight: 500; }
.page-header .user { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.page-header .user .logout { background: rgba(255,255,255,0.15); border: none; color: #fff; padding: 4px 10px; border-radius: 12px; font-size: 12px; cursor: pointer; }
.tabs { display: flex; background: #fff; border-bottom: 1px solid #eef0f3; position: sticky; top: 48px; z-index: 9; }
.tabs .tab { flex: 1; padding: 12px 0; text-align: center; font-size: 14px; color: #666; cursor: pointer; position: relative; }
.tabs .tab.active { color: #1faa8a; font-weight: 600; }
.tabs .tab.active::after { content: ''; position: absolute; left: 50%; bottom: 0; transform: translateX(-50%); width: 30px; height: 3px; background: #1faa8a; border-radius: 2px; }
.container { padding: 12px; }
.toolbar { display: flex; gap: 8px; align-items: center; background: #fff; padding: 10px 12px; border-radius: 8px; margin-bottom: 12px; flex-wrap: wrap; }
.toolbar select, .toolbar input { padding: 6px 8px; border: 1px solid #d8dde6; border-radius: 4px; font-size: 13px; }
.toolbar .btn { padding: 6px 14px; background: #1faa8a; color: #fff; border: none; border-radius: 4px; font-size: 13px; cursor: pointer; }
.toolbar .btn.ghost { background: #fff; color: #1faa8a; border: 1px solid #1faa8a; }
.scope-hint { background: #fff8e1; color: #8a6d3b; font-size: 12px; padding: 8px 12px; border-radius: 6px; margin-bottom: 12px; }

/* 统计 */
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 12px; }
.stat-card { background: #fff; border-radius: 8px; padding: 12px 6px; text-align: center; }
.stat-card .num { font-size: 22px; font-weight: 700; color: #1faa8a; }
.stat-card .lbl { font-size: 12px; color: #666; margin-top: 4px; }
.stat-row { background: #fff; border-radius: 8px; padding: 12px 14px; margin-bottom: 12px; }
.stat-row h3 { font-size: 14px; margin-bottom: 10px; color: #333; }
.bar-row { display: flex; align-items: center; margin-bottom: 6px; font-size: 13px; }
.bar-row .name { width: 90px; color: #555; }
.bar-row .bar { flex: 1; height: 14px; background: #f0f2f5; border-radius: 7px; overflow: hidden; margin-right: 8px; }
.bar-row .bar-fill { height: 100%; background: linear-gradient(90deg, #1faa8a, #2dd4a4); border-radius: 7px; transition: width 0.6s; }
.bar-row .num { color: #333; font-weight: 600; min-width: 24px; text-align: right; }

/* 列表 */
.list-card { background: #fff; border-radius: 8px; padding: 12px 14px; margin-bottom: 10px; cursor: pointer; }
.list-card:active { background: #f5f7fa; }
.list-card .row1 { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.list-card .code { font-weight: 600; color: #333; font-size: 14px; }
.list-card .meta { font-size: 12px; color: #888; margin-top: 4px; }
.list-card .meta span { margin-right: 12px; }
.list-card .desc { font-size: 13px; color: #555; line-height: 1.5; margin: 4px 0; max-height: 38px; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.empty { text-align: center; color: #999; padding: 40px 0; font-size: 14px; }
</style>
</head>
<body>

<div class="page-header">
  <div class="title">异常单管理</div>
  <div class="user">
    <span id="userName">--</span>
    <span id="userRole" style="opacity:0.85"></span>
    <button class="logout" id="btnLogout">退出</button>
  </div>
</div>

<div class="tabs">
  <div class="tab active" data-tab="list">异常单</div>
  <div class="tab" data-tab="stats">统计</div>
</div>

<div class="container">
  <div class="scope-hint" id="scopeHint"></div>

  <!-- 列表视图 -->
  <div id="viewList">
    <div class="toolbar">
      <div class="filter-tabs" id="statusTabs">
        <span class="tab active" data-status="">全部</span>
        <span class="tab" data-status="APPLIED">已申请</span>
        <span class="tab" data-status="QC_HANDLED">品管已处理</span>
        <span class="tab" data-status="SHIFT_CONFIRMED">班长已首件</span>
        <span class="tab" data-status="QC_CONFIRMED">品管已首件</span>
        <span class="tab" data-status="LEADER_CONFIRMED">组长已确认</span>
        <span class="tab" data-status="CHIEF_CONFIRMED">课长已确认</span>
        <span class="tab" data-status="CLOSED">已关闭</span>
      </div>
      <input type="text" id="kwFilter" placeholder="编号/描述模糊查询" style="flex:1; min-width:120px">
      <button class="btn" id="btnFilter">查询</button>
    </div>
    <div id="listBody"></div>
  </div>

  <!-- 统计视图 -->
  <div id="viewStats" style="display:none">
    <div class="toolbar">
      <label style="font-size:13px;color:#666">起始</label>
      <input type="date" id="fromDate">
      <label style="font-size:13px;color:#666">截止</label>
      <input type="date" id="toDate">
      <button class="btn" id="btnStat">刷新</button>
    </div>
    <div class="stats" id="statsCards"></div>
    <div class="stat-row">
      <h3>各状态分布</h3>
      <div id="statusBars"></div>
    </div>
    <div class="stat-row">
      <h3>各课分布</h3>
      <div id="sectionBars"></div>
    </div>
  </div>
</div>

<script src="js/common.js"></script>
<script src="js/page-guard.js"></script>
<script>
requireRole('admin');
</script>
<script>
// 状态筛选 Tab 切换
document.querySelectorAll('#statusTabs .tab').forEach(t => {
  t.addEventListener('click', () => {
    document.querySelectorAll('#statusTabs .tab').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    loadList();
  });
});
</script>
<script>
let currentUser = null;
let allReports = [];

const ROLE_LABELS = {
  SHIFT_LEADER: '班长',
  QC: '品管',
  SECTION_LEADER: '组长',
  SECTION_CHIEF: '课长',
  QUALITY_CHIEF: '品质部长'
};

const STATUS_LABELS = {
  APPLIED: '已申请',
  QC_HANDLED: '品管已处理',
  SHIFT_CONFIRMED: '班长已首件',
  QC_CONFIRMED: '品管已首件',
  LEADER_CONFIRMED: '组长已确认',
  CHIEF_CONFIRMED: '课长已确认',
  CLOSED: '已关闭'
};

document.querySelectorAll('.tab').forEach(t => {
  t.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    const tab = t.dataset.tab;
    document.getElementById('viewList').style.display = tab === 'list' ? 'block' : 'none';
    document.getElementById('viewStats').style.display = tab === 'stats' ? 'block' : 'none';
    if (tab === 'stats') loadStats();
  });
});

document.getElementById('btnLogout').addEventListener('click', async () => {
  try { await request('/api/auth/logout', { method: 'POST' }); } catch (_) {}
  logoutLocal();
});

document.getElementById('btnFilter').addEventListener('click', loadList);
document.getElementById('btnStat').addEventListener('click', loadStats);

async function init() {
  const me = await requireLogin('list.html');
  if (!me) return;
  currentUser = me;
  document.getElementById('userName').textContent = me.realName;
  document.getElementById('userRole').textContent = ROLE_LABELS[me.role] || me.role;
  renderScopeHint();
  await loadList();
  // 默认统计 30 天
  const d = new Date();
  document.getElementById('toDate').value = d.toISOString().slice(0, 10);
  d.setDate(d.getDate() - 30);
  document.getElementById('fromDate').value = d.toISOString().slice(0, 10);
}

function renderScopeHint() {
  const h = document.getElementById('scopeHint');
  const role = currentUser.role;
  let txt = '';
  if (role === 'QUALITY_CHIEF') txt = '当前账号：品质部长 — 可查看全部异常单与统计';
  else if (role === 'QC') txt = '当前账号：品管 — 可查看全部异常单';
  else if (role === 'SECTION_CHIEF' || role === 'SECTION_LEADER') txt = '当前账号：本课 — 仅可查看本课范围内数据';
  else if (role === 'SHIFT_LEADER') txt = '当前账号：班长 — 仅可查看本组范围内数据';
  else txt = '当前账号数据范围受限';
  h.textContent = txt;
}

async function loadList() {
  const active = document.querySelector('#statusTabs .tab.active');
  const status = active ? active.dataset.status : '';
  const url = status ? '/api/exceptions?status=' + status : '/api/exceptions';
  try {
    allReports = await request(url);
    const kw = (document.getElementById('kwFilter').value || '').trim().toLowerCase();
    const filtered = kw ? allReports.filter(r =>
      (r.code || '').toLowerCase().includes(kw) ||
      (r.description || '').toLowerCase().includes(kw) ||
      (r.implementer || '').toLowerCase().includes(kw) ||
      (r.reporter || '').toLowerCase().includes(kw)
    ) : allReports;
    renderList(filtered);
  } catch (e) {
    toast(e.message);
  }
}

function renderList(list) {
  const box = document.getElementById('listBody');
  if (!list.length) { box.innerHTML = '<div class="empty">暂无数据</div>'; return; }
  box.innerHTML = list.map(r => `
    <div class="list-card" onclick="goDetail(${r.id})">
      <div class="row1">
        <div class="code">${r.code || '—'}</div>
        ${statusBadge(r.status)}
      </div>
      <div class="desc">${escapeHtml(r.description || '（无描述）')}</div>
      <div class="meta">
        <span>实施: ${escapeHtml(r.implementer || '-')}</span>
        <span>报告: ${escapeHtml(r.reporter || '-')}</span>
      </div>
      <div class="meta">
        <span>${fmtDateTime(r.occurredAt)}</span>
        <span>${escapeHtml(r.shift || '')}</span>
        <span>${fmtDateTime(r.createdAt)}</span>
      </div>
    </div>
  `).join('');
}

window.goDetail = (id) => { location.href = 'detail.html?id=' + id; };

async function loadStats() {
  try {
    const from = document.getElementById('fromDate').value;
    const to = document.getElementById('toDate').value;
    const params = [];
    if (from) params.push('from=' + from + 'T00:00:00');
    if (to) params.push('to=' + to + 'T23:59:59');
    const qs = params.length ? '?' + params.join('&') : '';
    const data = await request('/api/exceptions/statistics' + qs);
    renderStats(data);
  } catch (e) { toast(e.message); }
}

function renderStats(data) {
  const cards = document.getElementById('statsCards');
  const byStatus = data.byStatus || {};
  const order = ['APPLIED', 'QC_HANDLED', 'CLOSED', 'TOTAL'];
  cards.innerHTML = order.filter(k => byStatus[k] !== undefined).map(k => `
    <div class="stat-card">
      <div class="num">${byStatus[k]}</div>
      <div class="lbl">${k === 'TOTAL' ? '总单数' : (STATUS_LABELS[k] || k)}</div>
    </div>
  `).join('');

  // 状态柱状
  const st = document.getElementById('statusBars');
  const statusOrder = ['APPLIED', 'QC_HANDLED', 'SHIFT_CONFIRMED', 'QC_CONFIRMED', 'LEADER_CONFIRMED', 'CHIEF_CONFIRMED', 'CLOSED'];
  const max = Math.max(1, ...statusOrder.map(k => byStatus[k] || 0));
  st.innerHTML = statusOrder.map(k => {
    const v = byStatus[k] || 0;
    const pct = (v / max * 100).toFixed(0);
    return `<div class="bar-row">
      <div class="name">${STATUS_LABELS[k]}</div>
      <div class="bar"><div class="bar-fill" style="width:${pct}%"></div></div>
      <div class="num">${v}</div>
    </div>`;
  }).join('');

  // 课柱状
  const sec = document.getElementById('sectionBars');
  const bySec = data.bySection || {};
  const entries = Object.entries(bySec);
  if (!entries.length) { sec.innerHTML = '<div class="empty">暂无数据</div>'; return; }
  const max2 = Math.max(1, ...entries.map(([_, v]) => v));
  sec.innerHTML = entries.map(([name, v]) => {
    const pct = (v / max2 * 100).toFixed(0);
    return `<div class="bar-row">
      <div class="name">${escapeHtml(name)}</div>
      <div class="bar"><div class="bar-fill" style="width:${pct}%"></div></div>
      <div class="num">${v}</div>
    </div>`;
  }).join('');
}

function escapeHtml(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

init();
</script>
</body>
</html>
